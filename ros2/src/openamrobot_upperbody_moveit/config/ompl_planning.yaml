# OMPL planning configuration: MoveIt's defaults, nothing tuned (A7). The pipeline plugin and the request/response adapters are the
# ones moveit_configs_utils ships for the installed MoveIt 2.12 (default_configs/ompl_planning.yaml, copied); the planner
# configurations come from default_configs/ompl_defaults.yaml, which MoveItConfigsBuilder merges in because this file has no
# `planner_configs`. The per-group blocks are the Setup Assistant's usual ones: every default planner, a joint projection
# evaluator on the first two joints, and the default longest valid segment fraction. No planner parameter was changed.

planning_plugins:
  - ompl_interface/OMPLPlanner
# The order of the elements in the adapter corresponds to the order they are processed by the motion planning pipeline.
request_adapters:
  - default_planning_request_adapters/ResolveConstraintFrames
  - default_planning_request_adapters/ValidateWorkspaceBounds
  - default_planning_request_adapters/CheckStartStateBounds
  - default_planning_request_adapters/CheckStartStateCollision
response_adapters:
  - default_planning_response_adapters/AddTimeOptimalParameterization
  - default_planning_response_adapters/ValidateSolution
  - default_planning_response_adapters/DisplayMotionPath

left_arm:
  planner_configs:
    - AnytimePathShortening
    - SBL
    - EST
    - LBKPIECE
    - BKPIECE
    - KPIECE
    - RRT
    - RRTConnect
    - RRTstar
    - TRRT
    - PRM
    - PRMstar
    - FMT
    - BFMT
    - PDST
    - STRIDE
    - BiTRRT
    - LBTRRT
    - BiEST
    - ProjEST
    - LazyPRM
    - LazyPRMstar
    - SPARS
    - SPARStwo
  projection_evaluator: joints(openarm_left_joint1,openarm_left_joint2)
  longest_valid_segment_fraction: 0.005

