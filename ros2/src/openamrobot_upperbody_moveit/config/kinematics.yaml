# Derived from enactic/openarm_ros2 openarm_bimanual_moveit_config/config/openarm_v2.0/kinematics.yaml @ 4e837e1
# (the commit pinned in the description package's config/upstream_pins.yaml, ADR-007). Derived, Apache-2.0.
# Changed by OpenAMRobot: nothing. KDL for both arms, as upstream. The base joints are not in any group, and the virtual joint is
# fixed (the SRDF, W02), so KDL never sees a planar root.

left_arm:
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_search_resolution: 0.0050000000000000001
  kinematics_solver_timeout: 0.0050000000000000001

right_arm:
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_search_resolution: 0.0050000000000000001
  kinematics_solver_timeout: 0.0050000000000000001
