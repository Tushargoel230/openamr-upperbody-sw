# MoveIt's controller mapping for the OpenAMRobot upper body (A7). Written for OUR controllers, the ones in
# openamrobot_upperbody_control/config/arm_controllers.yaml, not upstream's names (upstream's moveit_controllers.yaml names
# left_joint_trajectory_controller; ours are left_arm_controller, ... because that is what bring-up and the sim spawn).
#
# THE GRIPPER FORK (ADR-009 point 4, manipulation#11) IS NOT DECIDED HERE. This file is option 1, the one combination known to work
# end to end: position_controllers/GripperActionController serving control_msgs/action/GripperCommand, driven by
# moveit_simple_controller_manager's `GripperCommand` handle. Nothing else changes: the controller type in arm_controllers.yaml
# stays as it is. What the installed MoveIt can and cannot drive is in this package's README ("The gripper fork"), read from the
# installed plugin; the choice is Om's and Adnan's.
#
# ONE VALUE PER HAND (ADR-009 point 5): the two grippers take opposite-signed GripperCommand positions, left [0, 0.7854] and right
# [-0.7854, 0], so nothing below, and nothing that uses these controllers, may close both hands from one number. The SRDF's
# gripper states are written per hand and test_gripper_sign.py fails the single-number version.

moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

moveit_simple_controller_manager:
  controller_names:
    - left_arm_controller
    - right_arm_controller
    - left_gripper_controller
    - right_gripper_controller

  left_arm_controller:
    type: FollowJointTrajectory
    joints:
      - openarm_left_joint1
      - openarm_left_joint2
      - openarm_left_joint3
      - openarm_left_joint4
      - openarm_left_joint5
      - openarm_left_joint6
      - openarm_left_joint7
    action_ns: follow_joint_trajectory
    default: true

  right_arm_controller:
    type: FollowJointTrajectory
    joints:
      - openarm_right_joint1
      - openarm_right_joint2
      - openarm_right_joint3
      - openarm_right_joint4
      - openarm_right_joint5
      - openarm_right_joint6
      - openarm_right_joint7
    action_ns: follow_joint_trajectory
    default: true

  left_gripper_controller:
    type: GripperCommand
    joints:
      - openarm_left_finger_joint1
    action_ns: gripper_cmd
    default: true

  right_gripper_controller:
    type: GripperCommand
    joints:
      - openarm_right_finger_joint1
    action_ns: gripper_cmd
    default: true
