# Derived from enactic/openarm_ros2
#   openarm_bimanual_moveit_config/config/openarm_v2.0/ros2_controllers.yaml
#   @ 4e837e1 (pinned, ADR-001)
# Derived, Apache-2.0. Modified by OpenAMRobot:
#   - the arm controllers' state interfaces are position and velocity (upstream also lists effort);
#   - each gripper controller names its joint with `joint:` (a string), not `joints:` (a list). The Jazzy
#     GripperActionController reads `joint` and fails to configure with "Joint name cannot be empty" when it is absent;
#   - the gripper controllers' command_interfaces and state_interfaces lists are dropped: GripperActionController has
#     no such parameters (it always commands and reads position);
#   - the commented-out joint_trajectory_controller alternative for the grippers is dropped.
# Everything else is upstream.
#
# One file for every hardware profile (mock, gazebo, real; ADR-003). The joints are the ones the arm <ros2_control>
# blocks declare, openarm_{left,right}_joint1..7 and openarm_{left,right}_finger_joint1. finger_joint2 follows
# finger_joint1 through the URDF <mimic> and has no controller. The base is not under ros2_control.

controller_manager:
  ros__parameters:
    update_rate: 100 # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    left_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    right_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    left_gripper_controller:
      type: position_controllers/GripperActionController

    right_gripper_controller:
      type: position_controllers/GripperActionController

left_arm_controller:
  ros__parameters:
    joints:
      - openarm_left_joint1
      - openarm_left_joint2
      - openarm_left_joint3
      - openarm_left_joint4
      - openarm_left_joint5
      - openarm_left_joint6
      - openarm_left_joint7
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

right_arm_controller:
  ros__parameters:
    joints:
      - openarm_right_joint1
      - openarm_right_joint2
      - openarm_right_joint3
      - openarm_right_joint4
      - openarm_right_joint5
      - openarm_right_joint6
      - openarm_right_joint7
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

left_gripper_controller:
  ros__parameters:
    joint: openarm_left_finger_joint1

right_gripper_controller:
  ros__parameters:
    joint: openarm_right_finger_joint1
