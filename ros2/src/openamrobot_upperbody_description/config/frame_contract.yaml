  - {name: left_wrist_camera_optical_frame, kind: link, type: fixed, parent: left_wrist_camera_link, req: C, condition: "arm_package == openarm", owner: "A6 (openamr-upperbody-sw)", note: "REP-103 optical convention."}
  - {name: right_wrist_camera_joint, kind: joint, type: fixed, parent: openarm_right_ee_base_link, req: C, condition: "arm_package == openarm", owner: "A6 (openamr-upperbody-sw)"}
  - {name: right_wrist_camera_link, kind: link, type: fixed, parent: openarm_right_ee_base_link, req: C, condition: "arm_package == openarm", owner: "A6 (openamr-upperbody-sw)", note: "Placeholder pose until the kit datum is known.", collision_free: true, collision_free_reason: "Marker box visual only: no collision, no inertial. The box shows where the frame is; it is not a model of the sensor, so nothing may plan around it."}
  - {name: right_wrist_camera_optical_frame, kind: link, type: fixed, parent: right_wrist_camera_link, req: C, condition: "arm_package == openarm", owner: "A6 (openamr-upperbody-sw)", note: "REP-103 optical convention."}
  - {name: so101_mount_link, kind: link, type: fixed, parent: lift_carriage_link, req: C, condition: "arm_package == so101", owner: "A6 (openamr-upperbody-sw)", note: "Stub only. A9 (Jonathan) owns everything below it."}
  - {name: world, kind: link, type: root, parent: null, req: C, condition: "enable_planar_base == true", owner: "A6 (openamr-upperbody-sw)", note: "Becomes the root only when the planar base joint is enabled."}
  - {name: base_planar_joint, kind: joint, type: planar, parent: world, req: C, condition: "enable_planar_base == true", owner: "A6 (openamr-upperbody-sw)", note: "world -> base_footprint. Present in source, disabled by default."}

