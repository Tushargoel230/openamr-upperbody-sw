# Not ours, not checked: another owner's contract, consumed here (see the header). Alex, 12 Oct 2026 (P-03 rev19.0, register
# NEAR-FIELD-FRAMES): "take them from there, do not declare your own". The layout is 4 x MaxBotix MB7060 ultrasonic and 2 x TF-Luna
# cliff sensors, the reverse of the 7 Oct counts; platform-sw declares them in 935efc7 (Alex decision 2026-10-12, STEP MMP.00.00.00.000),
# merged on its main, and they come in with the included base file. The six frames this file used to list under other names
# (tof_front_left_link ... ultrasonic_rear_link, req W) were declared-but-absent and are DELETED, not renamed.
consumed_from:
  - owner: platform-sw
    contract: "openamr-platform-sw 935efc7: robo_urdf.urdf.xacro, near_field_frame macro (parent base_link); P-03 rev19.0, register NEAR-FIELD-FRAMES; imu_link (register FRAMES-REP105) and base_camera_link (register CAMERAS), parent base_link, same file. Names only: their poses are platform-sw's"
    frames: [us_front_left, us_front_right, us_rear_left, us_rear_right, tof_front, tof_rear, imu_link, base_camera_link]
