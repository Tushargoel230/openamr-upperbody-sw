# SPDX-License-Identifier: MIT
# Where our documents cite a decision of the register (openAMRobot/.github decisions.yaml) at a revision, and which revision. Read by
# tools/check_decision_currency.py (P22, a prototype run by hand; it is wired into no CI), which compares each entry with the register:
# the register's `source.document` for the decision is the revision it currently stands on. A revision that is not that one is STALE
# (older) or AHEAD (newer) and fails.
#
# One entry per citation:
#   document   path in this repository; `design:<path>` is relative to the design folder's 10_architecture directory
#   decision   a register decision id
#   revision   the register `sources` key the document cites (P-03-rev19.4, Alex decision 2026-10-12, ...)
#   quote      a verbatim piece of the document that states it (line breaks and leading `#` or `>` do not matter, emphasis marks are ignored);
#              it must contain the decision id and the revision, so the entry cannot say something the text does not
#   historical a reason, when the document cites the old revision on purpose (it describes history, or says the citation has changed).
#              The text must still be there; the revision is not compared
#
# `scan:` names the living documents whose versioned mentions of hyphenated decision ids must each be covered by an entry here (UNLISTED
# otherwise). History is not scanned: DESIGN_LOG.md, CHANGELOG.md, findings/, evidence/. A mention with no revision near it cannot be stale
# and is only counted.
#
# P22 left datums.yaml line 30 red (it cited FRAMES-REP105 at rev19.0) because re-citing it bumps the datums revision and every config_id;
# P23 took the bump (revision 2026-10-20.a) and the first two entries now cite CAMERAS and FRAMES-REP105 at rev19.4.
