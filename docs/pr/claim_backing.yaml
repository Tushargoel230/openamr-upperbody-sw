# Read by tools/check_evidence_backing.py (P22, a prototype run by hand; it is wired into no CI).
#
# A claim is matched by its normalised text in the document it is found in (`near` limits an entry to claims on a line that contains that
# text). Kinds:
#   json_count   how many committed reports match {glob(s), where: [...]}; a rate gives `numerator` and `denominator`; BACKED when they equal the claim
#   json_all     every committed report matching the globs has `path` == `equals` (at least `at_least` of them)
#   json_value   a file under evidence/ has the value (`path`, or `length: true` for a list's length) the claim states
#   record       a file under evidence/ contains `contains`: a written record, not data derived from the reports. Printed RECORDED
#   unbacked     nothing under evidence/ shows it; acknowledged WITH A REASON and still printed UNBACKED
# A verdict count ("25 PASS / 3 WARN / 0 FAIL") needs no entry: a committed report with exactly those counts backs it, and in the table rows of
# evidence/reports/README.md the report files named in the same row must have the counts.
#
# New numbers in the PR body or in a report are UNBACKED and fail until they are backed or acknowledged here. Acknowledging is a decision, not a default.
